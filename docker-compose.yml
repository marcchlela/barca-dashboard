services:
  postgres:
    image: postgres:18-alpine
    container_name: barca-dashboard-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: barca
      POSTGRES_PASSWORD: barca_dev_password
      POSTGRES_DB: barca_dashboard

    ports:
      - "5434:5432"

    volumes:
      - barca_dashboard_postgres:/var/lib/postgresql

volumes:
  barca_dashboard_postgres: